# Simatrix Academy PDF Tools — Production Nginx Configuration Template
# Place in: /etc/nginx/sites-available/simatrix_pdf
# Symlink:  /etc/nginx/sites-enabled/simatrix_pdf

upstream django_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name pdftools.simatrix.com; # Replace with your production domain

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pdftools.simatrix.com;

    # SSL Certificates (managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/pdftools.simatrix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdftools.simatrix.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size (50MB matching application limits)
    client_max_body_size 50M;
    client_body_timeout 120s;

    # Frontend Single Page Application (Static React Build)
    root /var/www/simatrix-pdf-tools/frontend/dist;
    index index.html;

    # Static Assets with aggressive caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static WebAssembly binaries
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Python Django Ninja REST API Proxy
    location /api/v1/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document processing timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming downloads
        proxy_buffering off;
    }

    # Block direct access to hidden files and internal storage
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Frontend React Router SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
