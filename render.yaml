# Render Blueprint Specification for Simatrix PDF Tools
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ==============================================================================
  # 1. Backend Web Service (Django 5.1 + Django Ninja + Python Engines)
  # ==============================================================================
  - type: web
    name: simatrix-pdf-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn wsgi:application
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_ROOT
        value: storage
      - key: CORS_ALLOWED_ORIGINS
        value: https://simatrix-pdf-frontend.onrender.com,https://pdf-tools-2-g8im.onrender.com,http://localhost:3000

  # ==============================================================================
  # 2. Frontend Static Site (React 18 + Vite + Font Awesome)
  # ==============================================================================
  - type: web
    name: simatrix-pdf-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: simatrix-pdf-backend
          property: host
